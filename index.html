<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Document, PDF and image tools that run in your browser. Your files stay on your device." />
<meta name="theme-color" content="#f4f5f0" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f1716" media="(prefers-color-scheme: dark)" />
<title>Doc Toolkit</title>
<link rel="icon" type="image/png" href="logo.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
/*
  Palette remap: every Tailwind "indigo", "gray", "slate" and "emerald" class
  used anywhere (including inside script.js) now resolves to the Doc Toolkit palette.
    indigo  -> petrol teal (accent)
    gray / slate -> green-tinted paper and ink neutrals
    emerald -> leaf green (success)
*/
const neutral = {
  50: '#f4f5f0', 100: '#e9ebe4', 200: '#d9dcd2', 300: '#bfc4b8', 400: '#939a8f',
  500: '#666e62', 600: '#4d554a', 700: '#3a4137', 800: '#283029', 900: '#1a2220', 950: '#0f1716'
};
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      fontFamily: {
        sans: ['"Instrument Sans"', 'system-ui', 'sans-serif'],
        display: ['Fraunces', 'Georgia', 'serif']
      },
      colors: {
        brand: '#0f6460',
        white: '#fdfdfb',
        hl: '#f6d33c',
        gray: neutral,
        slate: neutral,
        indigo: {
          50: '#eaf4f3', 100: '#cde6e3', 200: '#9fcdc8', 300: '#7fc1ba', 400: '#55aea5',
          500: '#2a8a82', 600: '#0f6460', 700: '#0c514e', 800: '#0b4140', 900: '#0a3433', 950: '#061f1f'
        },
        emerald: {
          50: '#f1f7e6', 100: '#e0eec5', 200: '#c6e08f', 300: '#aad060', 400: '#92c042',
          500: '#6ba52a', 600: '#4a8420', 700: '#386818', 800: '#2c5016', 900: '#234014', 950: '#12240a'
        }
      }
    }
  }
};
</script>
<link rel="stylesheet" href="styles.css">
</head>

<body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen pb-28 font-sans antialiased transition-colors duration-300 overflow-x-hidden">

  <!-- Top bar -->
  <div class="sticky top-0 z-30 bg-white dark:bg-slate-900 border-b border-gray-200 dark:border-slate-800">
    <header class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="Doc Toolkit logo" class="w-9 h-9 object-contain" />
        <h1 class="font-display text-xl font-semibold tracking-tight">Doc Toolkit</h1>
      </div>

      <button id="themeToggle" type="button" class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 px-3 py-2 text-xs font-medium text-gray-700 dark:text-slate-200 hover:bg-gray-100 dark:hover:bg-slate-700 transition-colors">
        <i class="ph-fill ph-sun text-sm" id="themeIcon"></i>
        <span id="themeText">Light</span>
      </button>
    </header>
  </div>

  <main class="max-w-5xl mx-auto px-4 pt-6">

    <!-- Tool list -->
    <section id="dashboardView">
      <p class="text-sm text-gray-600 dark:text-slate-400 mb-3">Files are processed in your browser and never uploaded.</p>

      <div class="mb-8 relative max-w-xl">
        <label for="toolSearch" class="sr-only">Search tools</label>
        <i class="ph ph-magnifying-glass pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 dark:text-slate-400 text-lg" aria-hidden="true"></i>
        <input type="text" id="toolSearch" autocomplete="off" placeholder="Search tools" class="w-full text-sm py-3 pl-10 pr-4 rounded-lg glass-input placeholder-gray-500 dark:placeholder-slate-400 text-gray-900 dark:text-slate-100" />
      </div>

      <div class="mb-4 flex items-center justify-between gap-3">
        <h2 id="tabHeading" class="font-display text-2xl font-semibold tracking-tight">Identity Tools</h2>
        <span id="toolCount" class="text-xs px-2.5 py-1 rounded-full font-semibold">5 Tools</span>
      </div>

      <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>

    <!-- Single tool -->
    <section id="workspaceView" class="hidden">
      <div class="max-w-2xl mx-auto">
        <button id="backBtn" type="button" class="mb-4 inline-flex items-center gap-1.5 text-sm font-semibold text-indigo-700 dark:text-indigo-300 hover:underline underline-offset-4">
          <i class="ph ph-arrow-left" aria-hidden="true"></i> Back to toolkit
        </button>

        <div class="glass-panel rounded-2xl p-5">
          <div class="flex items-center gap-3 mb-2">
            <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800">
              <span id="toolIcon" class="text-2xl text-indigo-600 dark:text-indigo-400"></span>
            </div>
            <div>
              <h3 id="toolTitle" class="font-display text-xl font-semibold leading-tight">Tool Title</h3>
              <p id="toolDesc" class="text-sm text-gray-600 dark:text-slate-400 mt-0.5">Description</p>
            </div>
          </div>

          <div id="toolFormContainer" class="space-y-4 mt-5 pt-5 border-t border-gray-200 dark:border-slate-800"></div>

          <div id="outputArea" class="mt-5 pt-5 border-t border-gray-200 dark:border-slate-800 hidden text-center">
            <p class="text-sm font-semibold text-emerald-700 dark:text-emerald-400 mb-3 flex items-center justify-center gap-1.5">
              <i class="ph-bold ph-check-circle" aria-hidden="true"></i> Processing complete
            </p>
            <div id="previewContainer" class="max-h-64 overflow-hidden rounded-lg flex items-center justify-center glass-input p-2 mb-4"></div>
            <a id="downloadBtn" href="#" download="processed_file" class="inline-flex w-full items-center justify-center rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-3 px-4 transition-colors">
              Download file
            </a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Category bar -->
  <nav class="bottom-bar fixed inset-x-0 bottom-0 z-30 bg-white dark:bg-slate-900 border-t border-gray-200 dark:border-slate-800" aria-label="Tool categories">
    <div class="max-w-5xl mx-auto px-3 py-2 flex justify-center gap-2">
      <button id="tab-identity" type="button" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-indigo-600 dark:text-indigo-400 bg-gray-100 dark:bg-slate-900 shadow-sm">
        <i class="ph ph-identification-card text-2xl mb-0.5" aria-hidden="true"></i>
        <span class="text-[10px] font-semibold tracking-wide">Identity</span>
      </button>
      <button id="tab-images" type="button" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white">
        <i class="ph ph-image text-2xl mb-0.5 opacity-80" aria-hidden="true"></i>
        <span class="text-[10px] font-medium tracking-wide">Images</span>
      </button>
      <button id="tab-pdfs" type="button" class="nav-btn w-24 py-2 flex flex-col items-center justify-center rounded-full transition-all text-gray-500 dark:text-slate-400 hover:text-gray-900 dark:hover:text-white">
        <i class="ph ph-file-pdf text-2xl mb-0.5 opacity-80" aria-hidden="true"></i>
        <span class="text-[10px] font-medium tracking-wide">PDFs</span>
      </button>
    </div>
  </nav>

<script src="script.js"></script>
</body>
</html>
