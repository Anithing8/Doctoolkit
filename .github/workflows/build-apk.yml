name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Wrap static site into Capacitor Android project
        run: |
          mkdir -p www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' . www/
          if [ -f www/index.html ]; then sed -i 's|/Doctoolkit/|./|g' www/index.html; fi
          rm -f www/package.json www/package-lock.json
          echo '{"name":"doctoolkit-app","version":"1.0.0","private":true}' > package.json
          echo '{"appId":"com.anithing8.doctoolkit","appName":"DocToolkit","webDir":"www"}' > capacitor.config.json
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocToolkit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
