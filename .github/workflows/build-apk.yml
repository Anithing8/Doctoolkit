name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Wrap static site into Capacitor Android project
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name 'www' ! -name '.git' ! -name '.github' ! -name '.' -exec cp -r {} www/ \;
          if [ -f www/index.html ]; then sed -i 's|/Doctoolkit/|./|g' www/index.html; fi
          echo '{"name":"doctoolkit","version":"1.0.0","description":"DocToolkit"}' > package.json
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init DocToolkit com.anithing8.doctoolkit --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocToolkit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
